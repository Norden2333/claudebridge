name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable-source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check source and version metadata
        run: node tools/check-source.mjs
      - name: Verify public-key identities
        run: node --test tests/extension-identity.test.mjs
  linux-regression:
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run portable regression suite
        run: node --test --test-concurrency=1 tests/*.test.mjs
